<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivDraw</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>DivDraw</h1>
    <main>
        <div class="tool-container">
            <button class="btn" id="size" title="Change grid size">Grid Size</button>
            <button class="btn" id="toggle-grid" title="Toggle grid lines">Toggle Grid</button>
            <button class="btn pen" id="regular" title="Regular Pen">P</button>
            <button class="btn pen" id="rainbow" title="Rainbow Pen">R</button>
            <button class="btn pen" id="dim" title="Dim Pen">D</button>
        </div>
        <div class="grid-container"> 
        </div>
    </main>
    <footer>
        <p>&copy; 2026 <a href="https://github.com/vbhidi" target="_blank" rel="noopener noreferrer">vbhidi</a>. All rights reserved.</p>
    </footer
</body>
</html>
